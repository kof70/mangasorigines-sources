name: Build and deploy sources
on:
  push:
    branches: [main]
    paths:
      - 'aidoku/**'
      - 'paperback/**'
      - 'kotatsu/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  aidoku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            aidoku/*/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('aidoku/**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # aidoku-rs doesn't publish prebuilt CLI binaries yet, so this always
      # compiles from source — the cargo cache above keeps repeat runs fast.
      - name: Install aidoku-cli
        run: command -v aidoku || cargo install --git https://github.com/Aidoku/aidoku-rs aidoku-cli

      - name: Package each Aidoku source
        run: |
          for src in aidoku/*/; do
            [ -f "$src/Cargo.toml" ] || continue
            (cd "$src" && aidoku package)
          done

      - name: Build source list
        run: aidoku build aidoku/*/package.aix --output public/aidoku

      - name: Upload aidoku site
        uses: actions/upload-artifact@v4
        with:
          name: site-aidoku
          path: public/aidoku

  # The `paperback` CLI's `bundle` command is opinionated about layout: it
  # must run from the toolchain project root (where package.json/tsconfig.json
  # live) and always reads sources from ./src and writes to ./bundles there —
  # it has no flag to point at an arbitrary output directory.
  paperback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle Paperback sources
        working-directory: paperback
        run: |
          npm install
          npx paperback bundle

      - name: Upload paperback site
        uses: actions/upload-artifact@v4
        with:
          name: site-paperback
          path: paperback/bundles
          if-no-files-found: ignore

  kotatsu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('kotatsu/mangasorigines/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: kotatsu/mangasorigines
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Publish APK as a release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kotatsu-latest
          name: Kotatsu source (latest build)
          body: Auto-built debug APK for the Kotatsu external source. Sideload and open once to register it with Kotatsu.
          prerelease: true
          files: kotatsu/mangasorigines/app/build/outputs/apk/debug/app-debug.apk

  deploy:
    needs: [aidoku, paperback]
    if: always() && needs.aidoku.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download aidoku site
        uses: actions/download-artifact@v4
        with:
          name: site-aidoku
          path: public/aidoku

      - name: Download paperback site
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: site-paperback
          path: public/paperback

      - name: Add landing page
        run: |
          cp site/index.html public/index.html
          cp -r site/assets public/assets

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        with:
          branch: gh-pages
          folder: public
          git-config-name: GitHub Actions
          git-config-email: github-actions[bot]@users.noreply.github.com
          commit-message: Update source lists
          single-commit: true
